apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - backendpolicy.yaml
  - httproute.yaml

namespace: governance-snapshot-stg

patches:
  # Autopilot bills requests: explicit CPU and memory (measured use ~1m CPU)
  - target:
      kind: Deployment
      name: governance-snapshot
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 50m
            memory: 100Mi
          limits:
            memory: 200Mi
